[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
version = "1.0.0"
description = "Éditeur PDF local pour Windows et Linux"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.26",
    "pymupdf-fonts>=1.0.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller", "ruff"]

[project.gui-scripts]
folio = "folio.app:main"

[tool.setuptools.packages.find]
include = ["folio*"]

[tool.setuptools.package-data]
folio = ["assets/*", "assets/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scenarios run inside e2e/shot.py's namespace
"e2e/scenario_*.py" = ["F821", "E402", "E702"]
